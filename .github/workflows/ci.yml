name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check Lambda handler
        run: python -m py_compile lambda/images/handler.py lambda/images/build_zip.py

      - name: Test image upload validation
        working-directory: lambda/images
        run: python -m unittest test_handler.py

      - name: Syntax-check scripts
        run: python -m py_compile scripts/hello.py

      - name: Run hello script smoke
        run: python scripts/hello.py --name ci
